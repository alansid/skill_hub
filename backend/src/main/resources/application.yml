spring:
  datasource:
    url: jdbc:h2:mem:skillhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    secret: skillhub-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  github:
    client-id: ${GITHUB_CLIENT_ID:dev-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:dev-client-secret}
    redirect-uri: http://localhost:8080/api/v1/auth/github/callback
